        function renderAuditLog() {
          const logs = state.auditLog || [];
          const rows = logs.length
            ? logs
                .slice()
                .reverse()
                .slice(0, 200)
                .map(
                  (l) => `
    <tr>
      <td>${formatTimestamp(l.timestamp)}</td>
      <td><span class="status-badge" style="background:${l.action === 'create' ? 'var(--success)' : l.action === 'update' ? 'var(--primary)' : l.action === 'delete' ? 'var(--danger)' : l.action === 'advance' ? 'var(--warning)' : 'var(--secondary)'};color:#fff;padding:2px 8px;font-size:.7rem">${l.action}</span></td>
      <td>${escHtml(l.username)}</td>
      <td>${escHtml(l.tmpNumber || '-')}</td>
      <td style="font-size:.8rem;color:var(--text-secondary);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(l.details || '')}</td>
    </tr>`
                )
                .join('')
            : '<tr><td colspan="5" class="empty-state"><p>No audit log entries yet.</p></td></tr>';
          return `<p class="settings-hint">Audit trail of all TMP actions. Showing last 200 entries (most recent first).</p>
    <div style="margin-bottom:12px"><button class="btn btn-sm btn-outline" data-action="clear-audit">🗑 Clear Audit Log</button></div>
    <div class="table-container" style="max-height:400px;overflow-y:auto">
    <table><thead><tr><th>Timestamp</th><th>Action</th><th>User</th><th>TMP</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        }

        // ===== KEYBOARD SHORTCUT HELP =====
        function showShortcutHelp(items) {
          document.getElementById('modalTitle').textContent = 'Keyboard Shortcuts';
          document.getElementById('modalBody').innerHTML =
            '<div class="table-container"><table><thead><tr><th style="width:180px">Shortcut</th><th>Action</th></tr></thead><tbody>' +
            items +
            '</tbody></table></div>';
          document.getElementById('modalFooter').innerHTML =
            '<button class="btn btn-outline" id="modalCancel">Close</button>';
          document.getElementById('modalOverlay').classList.add('open');
        }

        // ===== MODAL FORM =====
        function openFormModal(tmp) {
          if (!canEdit()) return;
          editingId = tmp ? tmp.id : null;
          const isEdit = !!editingId,
            isAdmin = userRole() === 'admin';
          document.getElementById('modalTitle').textContent = isEdit ? 'Edit TMP Request' : 'New TMP Request';
          let d = tmp || {
            tmpNumber: '',
            projectName: '',
            requestDate: todayStr(),
            clientName: '',
            location: '',
            dateOfWorks: '',
            details: '',
            assignedTo: '',
            priority: 'medium',
            status: 'new',
            customFields: {},
          };
          if (!tmp) {
            const dv = state.settings.defaultValues || {};
            Object.keys(dv).forEach((k) => {
              if (dv[k] !== '' && dv[k] !== undefined && dv[k] !== null) {
                if (k.startsWith('custom_')) {
                  if (!d.customFields) d.customFields = {};
                  d.customFields[k] = dv[k];
                } else {
                  d[k] = dv[k];
                }
              }
            });
          }
          const fields = getFormFieldsForEdit();
          const formHtml = fields
            .map((f) => {
              const val = f.key.startsWith('custom_')
                ? (d.customFields && d.customFields[f.key]) || ''
                : d[f.key] || '';
              const id = 'f_' + f.key,
                req = f.required ? 'required' : '',
                gc = f.gridClass || '';
              let input = '';
              if (f.type === 'select') {
                const opts =
                  f.options && Array.isArray(f.options)
                    ? f.options
                        .map(
                          (o) => `<option value="${escHtml(o)}" ${val === o ? 'selected' : ''}>${escHtml(o)}</option>`
                        )
                        .join('')
                    : (state.settings.priorities || DEFAULT_PRIORITIES)
                        .map(
                          (p) =>
                            `<option value="${p.id}" ${val === p.id ? 'selected' : ''}>${escHtml(p.label)}</option>`
                        )
                        .join('');
                input = `<select id="${id}">${opts}</select>`;
              } else if (f.type === 'textarea') {
                input = `<textarea id="${id}" ${req}>${escHtml(val)}</textarea>`;
              } else if (f.type === 'date') {
                input = `<input type="date" id="${id}" value="${escHtml(val)}" ${req}>`;
              } else if (f.type === 'checkbox') {
                input = `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 0"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${escHtml(f.label)}</label>`;
              } else if (f.key === 'clientName' && state.settings.clients && state.settings.clients.length) {
                const clients = state.settings.clients;
                const gov = clients.filter((c) => c.type === 'government'),
                  prv = clients.filter((c) => c.type === 'private');
                const opts = (g) =>
                  g
                    .map(
                      (c) =>
                        `<option value="${escHtml(c.name)}" ${val === c.name ? 'selected' : ''} style="${c.type === 'government' ? 'color:var(--primary)' : 'color:var(--purple)'}">🏛️ ${escHtml(c.name)}</option>`
                    )
                    .join('');
                const govOpts = gov.length ? `<optgroup label="🏛️ Government">${opts(gov)}</optgroup>` : '';
                const prvOpts = prv.length ? `<optgroup label="🏢 Private">${opts(prv)}</optgroup>` : '';
                input = `<select id="${id}"><option value="">-- Select Client --</option>${govOpts}${prvOpts}</select>`;
              } else {
                const ph =
                  f.key === 'tmpNumber'
                    ? getContent('placeholders.tmpNumber')
                    : f.key === 'assignedTo'
                      ? getContent('placeholders.assignedTo')
                      : '';
                input = `<input type="${f.type || 'text'}" id="${id}" value="${escHtml(val)}" ${req} placeholder="${ph}">`;
              }
              if (f.type === 'checkbox') return input;
              return `<div class="form-group ${gc}"><label for="${id}">${escHtml(f.label)}${f.required ? '<span style="color:var(--danger)">*</span>' : ''}</label>${input}</div>`;
            })
            .join('');
          const statusField =
            isEdit && isAdmin
              ? `<div class="form-group"><label for="f_status">Status</label><select id="f_status">${(state.settings.statuses || DEFAULT_STATUSES).map((s) => `<option value="${s.id}" ${d.status === s.id ? 'selected' : ''}>${escHtml(s.label)}</option>`).join('')}</select></div>`
              : '';
          const updatedInfo = isEdit
            ? `<div class="form-group full-width"><p style="font-size:.8rem;color:var(--text-secondary)">Last updated: ${formatTimestamp(tmp.lastUpdated)}</p></div>`
            : '';
          document.getElementById('modalBody').innerHTML =
            `<form id="tmpForm" autocomplete="off"><div class="form-grid">${formHtml}${statusField}${updatedInfo}</div></form>`;
          document.getElementById('modalFooter').innerHTML =
            `<button class="btn btn-outline" id="modalCancel">Cancel</button><button class="btn btn-primary" id="modalSave">${isEdit ? 'Update' : 'Create'} TMP</button>`;
          document.getElementById('modalOverlay').classList.add('open');
        }

        function handleFormSubmit() {
          if (!canEdit()) return;
          const fields = getFormFieldsForEdit(),
            data = {};
          let valid = true;
          const isAdmin = userRole() === 'admin';
          fields.forEach((f) => {
            const el = document.getElementById('f_' + f.key);
            if (!el) return;
            if (f.type === 'checkbox') {
              data[f.key] = el.checked;
              return;
            }
            const val = el.value.trim();
            data[f.key] = val;
            if (f.required && !val) valid = false;
          });
          const statusEl = document.getElementById('f_status');
          if (statusEl) data.status = statusEl.value;
          const customFields = {};
          Object.keys(data).forEach((k) => {
            if (k.startsWith('custom_')) {
              customFields[k] = data[k];
              delete data[k];
            }
          });
          data.customFields = customFields;
          if (
            !isAdmin &&
            (!valid ||
              !data.projectName ||
              !data.clientName ||
              !data.location ||
              !data.requestDate ||
              !data.dateOfWorks)
          ) {
            alert('Please fill in all required fields.');
            return;
          }
          if (editingId) updateTmp(editingId, data);
          else createTmp(data);
          closeModal();
          render();
        }

        function openDetailModal(id) {
          const t = state.tmps.find((x) => x.id === id);
          if (!t) return;
          viewingId = id;
          document.getElementById('modalTitle').textContent = 'TMP Details — ' + t.tmpNumber;
          const fields = [
            { label: 'TMP Number', value: t.tmpNumber },
            { label: 'Project Name', value: t.projectName },
            { label: 'Request Date', value: formatDate(t.requestDate) },
            {
              label: 'Client',
              value:
                t.clientName +
                (getClientType(t.clientName)
                  ? ' <span style="font-size:.7rem;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:' +
                    (getClientType(t.clientName) === 'government' ? 'var(--primary)' : 'var(--purple)') +
                    ';color:#fff;margin-left:4px">' +
                    getClientType(t.clientName) +
                    '</span>'
                  : ''),
            },
            { label: 'Location', value: t.location, full: true },
            { label: 'Date of Works', value: formatDate(t.dateOfWorks) },
            { label: 'Assigned To', value: t.assignedTo || '\u2014' },
            {
              label: 'Priority',
              value: `<span class="status-badge" style="${getPriorityStyle(t.priority)}">${escHtml(getPriorityLabel(t.priority))}</span>`,
            },
            { label: 'Status', value: renderStatusWithScheduled(t) },
            { label: 'Details', value: t.details || '\u2014', full: true },
            { label: 'Last Updated', value: formatTimestamp(t.lastUpdated), full: true },
          ];
          if (t.customFields) {
            (state.settings.customFields || []).forEach((f) => {
              const v = t.customFields[f.key];
              if (v !== undefined && v !== '' && f.enabled !== false)
                fields.push({
                  label: f.label,
                  value: f.type === 'checkbox' ? (v ? 'Yes' : 'No') : escHtml(String(v)),
                  full: false,
                });
            });
          }
          const items = fields
            .map(
              (f) =>
                `<div class="detail-item ${f.full ? 'full-width' : ''}"><div class="detail-label">${f.label}</div><div class="detail-value">${f.value}</div></div>`
            )
            .join('');
          document.getElementById('modalBody').innerHTML = `<div class="detail-grid">${items}</div>`;
          const btns = [`<button class="btn btn-outline" id="modalCancel">Close</button>`];
          if (canEdit())
            btns.push(`<button class="btn btn-outline" data-action="edit" data-id="${t.id}">✏️ Edit</button>`);
          const activeStatuses = getActiveStatuses(),
            curIdx = activeStatuses.findIndex((s) => s.id === t.status);
          if (canAdvanceStatus(t.status) && curIdx >= 0 && curIdx < activeStatuses.length - 1)
            btns.push(
              `<button class="btn btn-primary" data-action="advance" data-id="${t.id}">→ Move to ${escHtml(activeStatuses[curIdx + 1].label)}</button>`
            );
          document.getElementById('modalFooter').innerHTML = btns.join('');
          document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
          document.getElementById('modalOverlay').classList.remove('open');
          editingId = null;
          viewingId = null;
        }

        // ===== EVENTS =====
        function setupEvents() {
          document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const n = document.getElementById('loginName').value.trim(),
              pw = document.getElementById('loginPassword').value;
            if (!n || !pw) return;
            document.getElementById('roleDesc').innerHTML = 'Signing in...';
            try {
              const res = await apiPost('/api/auth/login', { username: n, password: pw });
              if (res && res.token) {
                localStorage.setItem(TOKEN_KEY, res.token);
                apiAvailable = true;
                handleLogin(res.user.username, res.user.role);
                return;
              }
            } catch (_) {}
            const users = state.settings.users || DEFAULT_USERS;
            const user = users.find((u) => u.username === n && u.password === pw);
            if (user) {
              apiAvailable = false;
              handleLogin(user.username, user.role);
            } else {
              document.getElementById('roleDesc').innerHTML =
                '<strong style="color:var(--danger)">Invalid username or password.</strong>';
            }
          });
          document.getElementById('userBadge').addEventListener('click', handleLogout);
          document.getElementById('sidebarNav').addEventListener('click', (e) => {
            const l = e.target.closest('[data-view]');
            if (l) {
              navigate(l.dataset.view);
              closeSidebar();
            }
          });
          function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
          }
          document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
          });
          document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
          let searchTimer;
          document.getElementById('globalSearch').addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
              state.searchQuery = document.getElementById('globalSearch').value;
              render();
            }, 250);
          });
          document.getElementById('newRequestBtn').addEventListener('click', () => {
            if (canEdit()) openFormModal(null);
          });
          document.getElementById('adminBtn').addEventListener('click', () => {
            if (!canManageSettings()) return;
            if (state.currentView === 'settings') navigate('dashboard');
            else navigate('settings');
          });
          document.getElementById('modalClose').addEventListener('click', closeModal);
          document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) closeModal();
          });

          document.addEventListener('click', (e) => {
            const t = e.target.closest('[data-action]');
            if (!t) return;
            const a = t.dataset.action,
              id = t.dataset.id,
              idx = t.dataset.idx,
              sidx = t.dataset.sidx,
              pidx = t.dataset.pidx,
              cfi = t.dataset.cfi,
              uidx = t.dataset.uidx,
              aidx = t.dataset.aidx,
              cidx = t.dataset.cidx;
            switch (a) {
              case 'new-request':
                if (canEdit()) openFormModal(null);
                break;
              case 'view':
                openDetailModal(id);
                break;
              case 'edit':
                if (!canEdit()) break;
                closeModal();
                const et = state.tmps.find((x) => x.id === id);
                if (et) openFormModal(et);
                break;
              case 'delete':
                if (!canDelete()) break;
                if (confirm('Delete this TMP?')) {
                  deleteTmp(id);
                  render();
                }
                break;
              case 'advance':
                {
                  if (!canAdvance()) break;
                  const rec = state.tmps.find((x) => x.id === id);
                  if (rec && !canAdvanceStatus(rec.status)) {
                    alert('Your role does not have permission to advance from this status.');
                    break;
                  }
                  if (rec) {
                    const as = getActiveStatuses(),
                      ci = as.findIndex((s) => s.id === rec.status);
                    if (
                      ci >= 0 &&
                      ci < as.length - 1 &&
                      confirm('Move "' + rec.tmpNumber + '" to "' + as[ci + 1].label + '"?')
                    ) {
                      advanceStatus(id);
                      render();
                      if (document.getElementById('modalOverlay').classList.contains('open') && viewingId === id)
                        openDetailModal(id);
                    }
                  }
                }
                break;
              case 'cal-prev':
                state.calendarDate.setMonth(state.calendarDate.getMonth() - 1);
                render();
                break;
              case 'cal-next':
                state.calendarDate.setMonth(state.calendarDate.getMonth() + 1);
                render();
                break;
              case 'cal-today':
                state.calendarDate = new Date();
                render();
                break;
              // Settings: add menu item
              case 'add-menu-item': {
                state.settings.menuItems.push({
                  id: 'custom-' + Date.now(),
                  label: 'New Item',
                  icon: '📄',
                  enabled: true,
                  badge: false,
                });
                persistSettings();
                render();
                break;
              }
              case 'del-menu-item': {
                const i = parseInt(idx);
                if (!isNaN(i) && confirm('Delete this menu item?')) {
                  state.settings.menuItems.splice(i, 1);
                  persistSettings();
                  render();
                }
                break;
              }
              case 'move-menu-up': {
                const i = parseInt(idx);
                if (!isNaN(i) && i > 0) {
                  const item = state.settings.menuItems.splice(i, 1)[0];
                  state.settings.menuItems.splice(i - 1, 0, item);
                  persistSettings();
                  render();
                }
                break;
              }
              case 'move-menu-down': {
                const i = parseInt(idx);
                if (!isNaN(i) && i < state.settings.menuItems.length - 1) {
                  const item = state.settings.menuItems.splice(i, 1)[0];
                  state.settings.menuItems.splice(i + 1, 0, item);
                  persistSettings();
                  render();
                }
                break;
              }
              // Settings: add status
              case 'add-status': {
                const sid = 'status-' + Date.now();
                state.settings.statuses.push({
                  id: sid,
                  label: 'New Status',
                  bg: '#dbeafe',
                  color: '#1e40af',
                  enabled: true,
                });
                persistSettings();
                render();
                break;
              }
              case 'del-status': {
                const i = parseInt(sidx);
                if (!isNaN(i) && confirm('Delete this status?')) {
                  state.settings.statuses.splice(i, 1);
                  persistSettings();
                  render();
                }
                break;
              }
              // Settings: add priority
              case 'add-priority': {
                state.settings.priorities.push({
                  id: 'pri-' + Date.now(),
                  label: 'New Priority',
                  bg: '#e2e8f0',
                  color: '#475569',
                });
                persistSettings();
                render();
                break;
              }
              case 'del-priority': {
                const i = parseInt(pidx);
                if (!isNaN(i) && confirm('Delete this priority?')) {
                  state.settings.priorities.splice(i, 1);
                  persistSettings();
                  render();
                }
                break;
              }
              // Settings: custom fields
              case 'edit-cfield': {
                const i = parseInt(cfi);
                if (!isNaN(i) && state.settings.customFields[i]) {
                  state.settings._editingCF = i;
                  render();
                }
                break;
              }
              case 'del-cfield': {
                const i = parseInt(cfi);
                if (!isNaN(i) && confirm('Delete this custom field?')) {
                  state.settings.customFields.splice(i, 1);
                  state.settings._editingCF = undefined;
                  persistSettings();
                  render();
                }
                break;
              }
              // Theme reset
              case 'reset-theme': {
                if (confirm('Reset theme to defaults?')) {
                  state.settings.theme = JSON.parse(JSON.stringify(DEFAULT_THEME));
                  applyTheme(state.settings.theme);
                  applyBrandImages();
                  persistSettings();
                  render();
                }
                break;
              }
              case 'remove-logo': {
                state.settings.theme.logo = '';
                applyBrandImages();
                persistSettings();
                render();
                break;
              }
              case 'remove-banner': {
                state.settings.theme.banner = '';
                applyBrandImages();
                persistSettings();
                render();
                break;
              }
              case 'remove-favicon': {
                state.settings.theme.favicon = '';
                applyBrandImages();
                persistSettings();
                render();
                break;
              }
              case 'remove-sidebar-bg': {
                state.settings.theme.sidebarBgImg = '';
                applyBrandImages();
                persistSettings();
                render();
                break;
              }
              // Users
              case 'add-user': {
                const users = state.settings.users;
                users.push({ username: 'newuser', password: 'password', role: 'viewer' });
                persistSettings();
                render();
                break;
              }
              case 'edit-user': {
                const i = parseInt(uidx);
                if (!isNaN(i) && state.settings.users[i]) {
                  state.settings._editingUser = i;
                  render();
                }
                break;
              }
              case 'del-user': {
                const i = parseInt(uidx);
                if (
                  !isNaN(i) &&
                  state.settings.users.length > 1 &&
                  confirm('Delete user "' + state.settings.users[i].username + '"?')
                ) {
                  state.settings.users.splice(i, 1);
                  state.settings._editingUser = undefined;
                  persistSettings();
                  render();
                }
                break;
              }
              // Export / Import / Backup
              case 'export-json':
                exportJSON();
                break;
              case 'export-csv':
                exportCSV();
                break;
              case 'backup-download':
                backupAll();
                break;
              case 'clear-audit': {
                if (confirm('Clear all audit log entries?')) {
                  state.auditLog = [];
                  persistAuditLog();
                  render();
                }
                break;
              }
              case 'bulk-sample':
                bulkSample();
                break;
              // Automations
              case 'add-auto': {
                state.settings.automations.push({
                  fromStatus: (getActiveStatuses()[0] || {}).id,
                  toStatus: (getActiveStatuses()[1] || {}).id,
                  delayDays: 3,
                  enabled: true,
                });
                state.settings._editingAuto = state.settings.automations.length - 1;
                persistSettings();
                render();
                break;
              }
              case 'edit-auto': {
                const i = parseInt(aidx);
                if (!isNaN(i) && state.settings.automations[i]) {
                  state.settings._editingAuto = i;
                  render();
                }
                break;
              }
              case 'del-auto': {
                const i = parseInt(aidx);
                if (!isNaN(i) && confirm('Delete this automation rule?')) {
                  state.settings.automations.splice(i, 1);
                  state.settings._editingAuto = undefined;
                  persistSettings();
                  render();
                }
                break;
              }
              // Clients
              case 'add-client': {
                state.settings.clients.push({
                  id: 'client-' + Date.now(),
                  name: 'New Client',
                  type: 'private',
                  contact: '',
                  phone: '',
                });
                state.settings._editingClient = state.settings.clients.length - 1;
                persistSettings();
                render();
                break;
              }
              case 'edit-client': {
                const i = parseInt(cidx);
                if (!isNaN(i) && state.settings.clients[i]) {
                  state.settings._editingClient = i;
                  render();
                }
                break;
              }
              case 'del-client': {
                const i = parseInt(cidx);
                if (!isNaN(i) && confirm('Delete this client?')) {
                  state.settings.clients.splice(i, 1);
                  state.settings._editingClient = undefined;
                  persistSettings();
                  render();
                }
                break;
              }
            }
          });

          // Settings tab switching
          document.getElementById('contentArea').addEventListener('click', (e) => {
            const tab = e.target.closest('[data-stab]');
            if (tab) {
              settingsTab = tab.dataset.stab;
              render();
            }
          });

          // Settings changes (delegated)
          document.getElementById('contentArea').addEventListener('change', (e) => {
            const el = e.target;
            // General
            if (el.id === 's-appName') {
              state.settings.content.appName = el.value;
              persistSettings();
              render();
              return;
            }
            if (el.id === 's-appTagline') {
              state.settings.content.appTagline = el.value;
              persistSettings();
              render();
              return;
            }
            // Menu
            if (el.classList.contains('s-menu-label')) {
              const i = parseInt(el.dataset.idx);
              if (!isNaN(i)) {
                state.settings.menuItems[i].label = el.value;
                persistSettings();
                renderSidebar();
              }
            }
            if (el.classList.contains('s-menu-icon')) {
              const i = parseInt(el.dataset.idx);
              if (!isNaN(i)) {
                state.settings.menuItems[i].icon = el.value;
                persistSettings();
                renderSidebar();
              }
            }
            if (el.classList.contains('s-menu-toggle')) {
              const i = parseInt(el.dataset.idx);
              if (!isNaN(i)) {
                state.settings.menuItems[i].enabled = el.checked;
                persistSettings();
                renderSidebar();
                render();
              }
            }
            // Statuses
            if (el.classList.contains('s-status-label')) {
              const i = parseInt(el.dataset.sidx);
              if (!isNaN(i)) {
                state.settings.statuses[i].label = el.value;
                persistSettings();
                document.getElementById('statusPreview' + i).textContent = el.value;
                render();
              }
            }
            if (el.classList.contains('s-status-bg')) {
              const i = parseInt(el.dataset.sidx);
              if (!isNaN(i)) {
                state.settings.statuses[i].bg = el.value;
                persistSettings();
                document.getElementById('statusPreview' + i).style.background = el.value;
              }
            }
            if (el.classList.contains('s-status-color')) {
              const i = parseInt(el.dataset.sidx);
              if (!isNaN(i)) {
                state.settings.statuses[i].color = el.value;
                persistSettings();
                document.getElementById('statusPreview' + i).style.color = el.value;
              }
            }
            if (el.classList.contains('s-status-toggle')) {
              const i = parseInt(el.dataset.sidx);
              if (!isNaN(i)) {
                state.settings.statuses[i].enabled = el.checked;
                persistSettings();
                render();
              }
            }
            // Priorities
            if (el.classList.contains('s-priority-label')) {
              const i = parseInt(el.dataset.pidx);
              if (!isNaN(i)) {
                state.settings.priorities[i].label = el.value;
                persistSettings();
                document.getElementById('priorityPreview' + i).textContent = el.value;
              }
            }
            if (el.classList.contains('s-priority-bg')) {
              const i = parseInt(el.dataset.pidx);
              if (!isNaN(i)) {
                state.settings.priorities[i].bg = el.value;
                persistSettings();
                document.getElementById('priorityPreview' + i).style.background = el.value;
              }
            }
            if (el.classList.contains('s-priority-color')) {
              const i = parseInt(el.dataset.pidx);
              if (!isNaN(i)) {
                state.settings.priorities[i].color = el.value;
                persistSettings();
                document.getElementById('priorityPreview' + i).style.color = el.value;
              }
            }
            // Content
            if (el.classList.contains('s-content-title')) {
              const v = el.dataset.view;
              if (v) {
                state.settings.content.viewTitles[v] = el.value;
                persistSettings();
                document.getElementById('viewTitle').textContent = getContent('viewTitles.' + state.currentView);
              }
            }
            if (el.classList.contains('s-content-ph')) {
              const k = el.dataset.key;
              if (k) {
                if (!state.settings.content.placeholders) state.settings.content.placeholders = {};
                state.settings.content.placeholders[k] = el.value;
                persistSettings();
                document.getElementById('globalSearch').placeholder = getContent('placeholders.search');
              }
            }
            if (el.classList.contains('s-content-label')) {
              const k = el.dataset.key;
              if (k) {
                if (!state.settings.content.labels) state.settings.content.labels = {};
                state.settings.content.labels[k] = el.value;
                persistSettings();
              }
            }
            // Theme
            if (el.classList.contains('s-theme-color')) {
              const k = el.dataset.key;
              if (k) {
                state.settings.theme[k] = el.value;
                applyTheme(state.settings.theme);
                persistSettings();
              }
            }
            if (el.classList.contains('s-theme-hex')) {
              const k = el.dataset.key;
              if (k && el.value.match(/^#[0-9a-f]{6}$/i)) {
                state.settings.theme[k] = el.value;
                const colorInput = document.querySelector(`.s-theme-color[data-key="${k}"]`);
                if (colorInput) colorInput.value = el.value;
                applyTheme(state.settings.theme);
                persistSettings();
              }
            }
            if (el.classList.contains('s-theme-radius')) {
              state.settings.theme.radius = el.value;
              applyTheme(state.settings.theme);
              persistSettings();
            }
            if (el.classList.contains('s-theme-font')) {
              state.settings.theme.font = el.value;
              applyTheme(state.settings.theme);
              persistSettings();
            }
            if (el.classList.contains('s-theme-range')) {
              const k = el.dataset.key;
              if (k) {
                state.settings.theme[k] = el.value;
                const sv = el.parentElement.querySelector('.s-range-val');
                if (sv) sv.textContent = el.value;
                applyTheme(state.settings.theme);
                persistSettings();
              }
            }
            // Image upload
            if (el.classList.contains('s-image-upload') && el.files && el.files[0]) {
              const imgKey = el.dataset.imgkey;
              if (imgKey) {
                const reader = new FileReader();
                reader.onload = function (ev) {
                  state.settings.theme[imgKey] = ev.target.result;
                  applyTheme(state.settings.theme);
                  applyBrandImages();
                  persistSettings();
                  render();
                };
                reader.readAsDataURL(el.files[0]);
              }
            }
            // Columns
            if (el.classList.contains('s-col-view-select')) {
              state.settings._colStatus = el.value;
              render();
            }
            if (el.classList.contains('s-col-toggle')) {
              const s = el.dataset.status,
                i = parseInt(el.dataset.colidx);
              if (s && !isNaN(i) && state.settings.tableColumns[s] && state.settings.tableColumns[s][i]) {
                state.settings.tableColumns[s][i].enabled = el.checked;
                persistSettings();
              }
            }
            // Forms
            if (el.classList.contains('s-field-required')) {
              const i = parseInt(el.dataset.fldidx);
              if (!isNaN(i) && state.settings.formFields[i]) {
                state.settings.formFields[i].required = el.checked;
                persistSettings();
              }
            }
            if (el.classList.contains('s-field-toggle')) {
              const i = parseInt(el.dataset.fldidx);
              if (!isNaN(i) && state.settings.formFields[i]) {
                state.settings.formFields[i].enabled = el.checked;
                persistSettings();
              }
            }
            if (el.classList.contains('s-cfield-toggle')) {
              const i = parseInt(el.dataset.cfi);
              if (!isNaN(i) && state.settings.customFields[i]) {
                state.settings.customFields[i].enabled = el.checked;
                persistSettings();
              }
            }
            if (el.id === 'cf_type') {
              const og = document.getElementById('cf_options_group');
              if (og) og.style.display = el.value === 'select' ? 'flex' : 'none';
            }
            // Transitions
            if (el.classList.contains('s-transition-role')) {
              const status = el.dataset.status,
                role = el.dataset.role;
              if (status && role) {
                if (!state.settings.statusRules) state.settings.statusRules = {};
                if (!state.settings.statusRules[status])
                  state.settings.statusRules[status] = { canAdvanceRoles: ['admin', 'planner', 'inspector'] };
                const rule = state.settings.statusRules[status];
                if (el.checked) {
                  if (!rule.canAdvanceRoles.includes(role)) rule.canAdvanceRoles.push(role);
                } else {
                  rule.canAdvanceRoles = rule.canAdvanceRoles.filter((r) => r !== role);
                }
                persistSettings();
              }
            }
            // Defaults
            if (el.classList.contains('s-default-val')) {
              const k = el.dataset.dkey;
              if (k) {
                if (!state.settings.defaultValues) state.settings.defaultValues = {};
                state.settings.defaultValues[k] = el.value;
                persistSettings();
              }
            }
            if (el.classList.contains('s-default-check')) {
              const k = el.dataset.dkey;
              if (k) {
                if (!state.settings.defaultValues) state.settings.defaultValues = {};
                state.settings.defaultValues[k] = el.checked ? 'true' : '';
                persistSettings();
              }
            }
            // Widgets
            if (el.classList.contains('s-widget-toggle')) {
              const k = el.dataset.wkey;
              if (k) {
                if (!state.settings.dashboardWidgets) state.settings.dashboardWidgets = {};
                state.settings.dashboardWidgets[k] = el.checked;
                persistSettings();
              }
            }
            // Density
            if (el.classList.contains('s-density-radio') && el.checked) {
              state.settings.rowDensity = el.value;
              persistSettings();
              render();
            }
            // Shortcuts
            if (el.classList.contains('s-shortcut-input')) {
              const k = el.dataset.sckey;
              if (k) {
                if (!state.settings.keyboardShortcuts) state.settings.keyboardShortcuts = {};
                state.settings.keyboardShortcuts[k] = el.value;
                persistSettings();
              }
            }
            if (el.classList.contains('s-auto-toggle')) {
              const i = parseInt(el.dataset.aidx);
              if (!isNaN(i) && state.settings.automations[i]) {
                state.settings.automations[i].enabled = el.checked;
                persistSettings();
              }
            }
            // Import JSON file
            if (el.classList.contains('s-import-json') && el.files && el.files[0]) {
              const reader = new FileReader();
              reader.onload = function (ev) {
                importJSON(ev.target.result);
                el.value = '';
              };
              reader.readAsText(el.files[0]);
            }
            // Restore backup file
            if (el.classList.contains('s-backup-restore') && el.files && el.files[0]) {
              const reader = new FileReader();
              reader.onload = function (ev) {
                restoreAll(ev.target.result);
                el.value = '';
              };
              reader.readAsText(el.files[0]);
            }
          });

          // Custom field save/cancel + palette
          document.getElementById('contentArea').addEventListener('click', (e) => {
            if (e.target.id === 'cf_save') {
              const label = document.getElementById('cf_label').value.trim(),
                type = document.getElementById('cf_type').value,
                rawOptions = document.getElementById('cf_options') ? document.getElementById('cf_options').value : '',
                gridClass = document.getElementById('cf_grid') ? document.getElementById('cf_grid').value : '',
                required = document.getElementById('cf_required')
                  ? document.getElementById('cf_required').checked
                  : false;
              if (!label) {
                alert('Field label required.');
                return;
              }
              const options =
                type === 'select'
                  ? rawOptions
                      .split(',')
                      .map((o) => o.trim())
                      .filter(Boolean)
                  : undefined;
              const key =
                'custom_' +
                label
                  .toLowerCase()
                  .replace(/[^a-z0-9]+/g, '_')
                  .replace(/^_|_$/g, '');
              const field = { key, label, type, required, options, gridClass, enabled: true };
              if (state.settings._editingCF !== undefined) {
                const orig = state.settings.customFields[state.settings._editingCF];
                field.key = orig.key;
                state.settings.customFields[state.settings._editingCF] = field;
              } else {
                state.settings.customFields.push(field);
              }
              state.settings._editingCF = undefined;
              persistSettings();
              render();
            }
            if (e.target.id === 'cf_cancel') {
              state.settings._editingCF = undefined;
              render();
            }
            const palette = e.target.closest('[data-palette]');
            if (palette) {
              state.settings._editingCF = undefined;
              render();
              setTimeout(() => {
                const te = document.getElementById('cf_type'),
                  og = document.getElementById('cf_options_group');
                if (te) {
                  te.value = palette.dataset.palette;
                  if (og) og.style.display = palette.dataset.palette === 'select' ? 'flex' : 'none';
                }
              }, 50);
            }
            // User edit save/cancel
            if (e.target.id === 'eu_save') {
              const i = state.settings._editingUser;
              if (i === undefined || !state.settings.users[i]) return;
              const username = document.getElementById('eu_username').value.trim(),
                password = document.getElementById('eu_password').value,
                role = document.getElementById('eu_role').value;
              if (!username) {
                alert('Username required.');
                return;
              }
              if (password) state.settings.users[i].password = password;
              state.settings.users[i].username = username;
              state.settings.users[i].role = role;
              state.settings._editingUser = undefined;
              persistSettings();
              render();
            }
            if (e.target.id === 'eu_cancel') {
              state.settings._editingUser = undefined;
              render();
            }
            // Automation save/cancel
            if (e.target.id === 'ea_save') {
              const i = state.settings._editingAuto;
              if (i === undefined || !state.settings.automations[i]) return;
              state.settings.automations[i].fromStatus = document.getElementById('ea_from').value;
              state.settings.automations[i].toStatus = document.getElementById('ea_to').value;
              state.settings.automations[i].delayDays = parseInt(document.getElementById('ea_days').value) || 1;
              state.settings._editingAuto = undefined;
              persistSettings();
              render();
            }
            if (e.target.id === 'ea_cancel') {
              state.settings._editingAuto = undefined;
              render();
            }
            // Client save/cancel
            if (e.target.id === 'ec_save') {
              const i = state.settings._editingClient;
              if (i === undefined || !state.settings.clients[i]) return;
              const name = document.getElementById('ec_name').value.trim();
              if (!name) {
                alert('Client name required.');
                return;
              }
              state.settings.clients[i].name = name;
              state.settings.clients[i].type = document.getElementById('ec_type').value;
              state.settings.clients[i].contact = document.getElementById('ec_contact').value.trim();
              state.settings.clients[i].phone = document.getElementById('ec_phone').value.trim();
              state.settings._editingClient = undefined;
              persistSettings();
              render();
            }
            if (e.target.id === 'ec_cancel') {
              state.settings._editingClient = undefined;
              render();
            }
          });

          document.getElementById('modalFooter').addEventListener('click', (e) => {
            const el = e.target.closest('button,[data-action]');
            if (!el) return;
            if (el.id === 'modalCancel') {
              closeModal();
              e.stopPropagation();
              return;
            }
            if (el.id === 'modalSave') {
              handleFormSubmit();
              e.stopPropagation();
              return;
            }
            const act = el.dataset.action;
            if (act === 'edit') {
              if (!canEdit()) return;
              const t = state.tmps.find((x) => x.id === el.dataset.id);
              if (t) {
                closeModal();
                openFormModal(t);
              }
              e.stopPropagation();
            }
            if (act === 'advance') {
              if (!canAdvance()) return;
              const rec = state.tmps.find((x) => x.id === el.dataset.id);
              if (rec && !canAdvanceStatus(rec.status)) {
                alert('Your role does not have permission to advance from this status.');
                e.stopPropagation();
                return;
              }
              if (rec) {
                const as = getActiveStatuses(),
                  ci = as.findIndex((s) => s.id === rec.status);
                if (
                  ci >= 0 &&
                  ci < as.length - 1 &&
                  confirm('Move "' + rec.tmpNumber + '" to "' + as[ci + 1].label + '"?')
                ) {
                  advanceStatus(el.dataset.id);
                  render();
                  if (viewingId === el.dataset.id) openDetailModal(el.dataset.id);
                  else closeModal();
                }
              }
              e.stopPropagation();
            }
          });

          // Drag-and-drop reordering for menu items
          document.getElementById('contentArea').addEventListener('dragstart', (e) => {
            const row = e.target.closest('.setting-row[draggable]');
            if (row) {
              row.classList.add('dragging');
              e.dataTransfer.setData('text/plain', row.dataset.idx);
            }
          });
          document.getElementById('contentArea').addEventListener('dragover', (e) => {
            const row = e.target.closest('.setting-row[draggable]');
            if (row) {
              e.preventDefault();
              row.classList.add('drag-over');
            }
          });
          document.getElementById('contentArea').addEventListener('dragleave', (e) => {
            const row = e.target.closest('.setting-row[draggable]');
            if (row) row.classList.remove('drag-over');
          });
          document.getElementById('contentArea').addEventListener('drop', (e) => {
            e.preventDefault();
            const target = e.target.closest('.setting-row[draggable]');
            if (!target) return;
            target.classList.remove('drag-over');
            const fromIdx = parseInt(e.dataTransfer.getData('text/plain')),
              toIdx = parseInt(target.dataset.idx);
            if (!isNaN(fromIdx) && !isNaN(toIdx) && fromIdx !== toIdx) {
              const items = state.settings.menuItems;
              const item = items.splice(fromIdx, 1)[0];
              items.splice(toIdx, 0, item);
              persistSettings();
              render();
            }
          });
          document.getElementById('contentArea').addEventListener('dragend', (e) => {
            document
              .querySelectorAll('.setting-row.dragging,.setting-row.drag-over')
              .forEach((el) => el.classList.remove('dragging', 'drag-over'));
          });

          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
          });

          // Keyboard shortcuts
          document.addEventListener('keydown', (e) => {
            const sc = state.settings.keyboardShortcuts || DEFAULT_KEYBOARD_SHORTCUTS;
            const combo =
              (e.ctrlKey ? 'ctrl+' : '') +
              (e.shiftKey ? 'shift+' : '') +
              (e.altKey ? 'alt+' : '') +
              e.key.toLowerCase();
            // Help shortcut
            if (
              e.key === sc.help ||
              (e.key === '?' && !e.ctrlKey && !e.altKey && !e.metaKey) ||
              (e.key === '/' && e.ctrlKey)
            ) {
              e.preventDefault();
              const helpItems = Object.keys(DEFAULT_KEYBOARD_SHORTCUTS)
                .map((k) => {
                  const labels = {
                    newRequest: 'New TMP Request',
                    globalSearch: 'Global Search',
                    exportJSON: 'Export JSON to file',
                    dashboard: 'Go to Dashboard',
                    calendar: 'Go to Calendar',
                    adminSettings: 'Open Admin Settings',
                    help: 'Show this help',
                  };
                  return (
                    '<tr><td style="font-family:monospace;font-weight:600">' +
                    escHtml(sc[k] || DEFAULT_KEYBOARD_SHORTCUTS[k]) +
                    '</td><td>' +
                    labels[k] +
                    '</td></tr>'
                  );
                })
                .join('');
              showShortcutHelp(helpItems);
              return;
            }
            // Check each shortcut
            Object.keys(sc).forEach((k) => {
              if (k === 'help') return;
              const s = sc[k] || DEFAULT_KEYBOARD_SHORTCUTS[k];
              if (combo === s.toLowerCase()) {
                e.preventDefault();
                switch (k) {
                  case 'newRequest':
                    if (canEdit()) openFormModal(null);
                    break;
                  case 'globalSearch':
                    document.getElementById('globalSearch').focus();
                    break;
                  case 'exportJSON':
                    exportJSON();
                    break;
                  case 'dashboard':
                    navigate('dashboard');
                    break;
                  case 'calendar':
                    navigate('calendar');
                    break;
                  case 'adminSettings':
                    if (canManageSettings()) {
                      if (state.currentView === 'settings') navigate('dashboard');
                      else navigate('settings');
                    }
                    break;
                }
              }
            });
          });
        }

        async function init() {
          await Promise.all([loadData(), loadSettings(), loadAuditLog()]);
          loadUser();
          const origNavigate = navigate;
          const hashMap = {
            '#dashboard': 'dashboard',
            '#new': 'new',
            '#in-progress': 'in-progress',
            '#permits-lga': 'permits-lga',
            '#approvals': 'approvals',
            '#completed': 'completed',
            '#calendar': 'calendar',
            '#settings': 'settings',
          };
          const reverseMap = {
            dashboard: '#dashboard',
            new: '#new',
            'in-progress': '#in-progress',
            'permits-lga': '#permits-lga',
            approvals: '#approvals',
            completed: '#completed',
            calendar: '#calendar',
            settings: '#settings',
          };
          navigate = function (v) {
            if (v === 'settings' && !canManageSettings()) v = 'dashboard';
            const h = reverseMap[v];
            if (h && window.location.hash !== h) history.pushState(null, '', h);
            origNavigate(v);
          };
          window.addEventListener('hashchange', () => {
            const v = hashMap[window.location.hash] || 'dashboard';
            origNavigate(v);
          });
          setupEvents();
          if (state.currentUser) {
            hideLogin();
            document.getElementById('sidebarUser').textContent = 'Logged in as ' + state.currentUser.username;
            document.getElementById('userBadgeText').textContent =
              state.currentUser.role.charAt(0).toUpperCase() + state.currentUser.role.slice(1);
            navigate(hashMap[window.location.hash] || 'dashboard');
          } else {
            showLogin();
            navigate('dashboard');
          }
        }
        document.addEventListener('DOMContentLoaded', init);
      })();
    </script>
  </body>
</html>
