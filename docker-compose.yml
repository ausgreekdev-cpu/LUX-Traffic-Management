services:
  lux-backend:
    build: .
    image: lux-traffic-management:latest
    container_name: lux-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      CORS_ORIGIN: "http://localhost:3001"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - lux-data:/app/data
      - lux-uploads:/app/uploads

volumes:
  lux-data:
  lux-uploads: