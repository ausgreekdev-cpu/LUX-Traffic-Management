[build]
  command = "sh netlify-build.sh"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_CACHE = "/opt/buildhome/.npm"
  NPM_CONFIG_OPTIONAL = "true"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@netlify/blobs",
    "bcryptjs",
    "better-sqlite3",
    "cors",
    "dotenv",
    "express",
    "helmet",
    "jsonwebtoken",
    "nodemailer",
    "pdfkit",
    "serverless-http",
    "stripe",
    "uuid",
    "zod"
  ]
  included_files = ["backend/data/wa-lga-directory.json"]

# Missing static assets must 404, not be rewritten to index.html.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
