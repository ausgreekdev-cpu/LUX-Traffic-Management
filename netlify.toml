[build]
  command = "rm -rf frontend/dist && npm run install:all && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@netlify/blobs",
    "bcryptjs",
    "better-sqlite3",
    "cors",
    "dotenv",
    "express",
    "helmet",
    "jsonwebtoken",
    "multer",
    "nodemailer",
    "pdf-parse",
    "pdfkit",
    "serverless-http",
    "uuid",
    "zod"
  ]
  included_files = ["backend/data/wa-lga-directory.json"]

[functions.node]
  node_version = "24"

# Missing static assets must 404, not be rewritten to index.html. Served as HTML
# they make dynamic import() throw "Failed to fetch dynamically imported module"
# for stale-cache clients. Existing files still win over this rule.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
