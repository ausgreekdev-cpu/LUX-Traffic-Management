[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  node_version = "22"
  external_node_modules = ["pdf-parse", "pdfkit"]
  included_files = ["backend/data/wa-lga-directory.json"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
