[build]
  command = "sh netlify-build.sh"
  publish = "frontend/dist"
  functions = "netlify/functions"
  
  # Enable build caching
  cache = true

[build.environment]
  NODE_VERSION = "24"
  # Cache npm packages
  NPM_CONFIG_CACHE = "/opt/buildhome/.npm"
  # Skip optional deps in production
  NPM_CONFIG_OPTIONAL = "false"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@netlify/blobs",
    "bcryptjs",
    "better-sqlite3",
    "cors",
    "dotenv",
    "express",
    "helmet",
    "jsonwebtoken",
    "nodemailer",
    "pdfkit",
    "serverless-http",
    "uuid",
    "zod"
  ]
  included_files = ["backend/data/wa-lga-directory.json"]
  # Enable function caching
  node_bundler_options = { external: ["better-sqlite3"] }

[functions.node]
  node_version = "24"

[functions.runtime]
  # Enable function caching for faster cold starts
  cache = true

# Missing static assets must 404, not be rewritten to index.html. Served as HTML
# they make dynamic import() throw "Failed to fetch dynamically imported module"
# for stale-cache clients. Existing files still win over this rule.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
