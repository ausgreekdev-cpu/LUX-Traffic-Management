[build]
  command = "npm run install:all && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdf-parse", "pdfkit"]
  included_files = ["backend/data/wa-lga-directory.json"]

[functions.node]
  node_version = "24"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
